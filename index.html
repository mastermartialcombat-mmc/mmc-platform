<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Martial Combat - Wushu Tournaments</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mmcDark: '#0b0f19',
                        mmcCard: '#131b2e',
                        mmcGold: '#f59e0b',
                        mmcRed: '#dc2626'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-mmcDark text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Barra de Navegación Superior -->
    <header class="bg-mmcCard border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black tracking-wider text-mmcGold">MMC</span>
                <span class="text-xs uppercase tracking-widest text-gray-400 hidden sm:inline">Master Martial Combat</span>
            </div>
            <nav class="hidden md:flex space-x-6 text-sm font-semibold">
                <button onclick="switchView('home')" class="hover:text-mmcGold transition">Inicio</button>
                <button onclick="switchView('sanda')" class="hover:text-mmcGold transition">Sanshou</button>
                <button onclick="switchView('taolu')" class="hover:text-mmcGold transition">Taolu</button>
                <button onclick="switchView('medallero')" class="hover:text-mmcGold transition">Medallero</button>
            </nav>
        </div>
    </header>

    <!-- Contenedor Dinámico de Vistas -->
    <main id="app-container" class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        <!-- Aquí cargaremos dinámicamente las vistas mediante JavaScript -->
        <div class="text-center py-20">
            <h2 class="text-3xl font-bold text-mmcGold mb-4">Cargando Campeonatos...</h2>
            <p class="text-gray-400">Conectando en tiempo real con Google Sheets de MMC.</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-mmcCard border-t border-gray-800 py-4 text-center text-xs text-gray-500">
        Master Martial Combat Wushu Platform © 2026 • Desarrollado para competencias de alto rendimiento.
    </footer>

    <!-- Script Principal -->
    <script src="app.js"></script>
</body>
</html>
